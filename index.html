<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#394c41">
<title>Oiru Bio</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
  :root{
    --verde:#394c41; --lima:#b5c941; --laranja:#e38e3f; --amarelo:#fdea00;
    --branco:#ffffff; --cinza:#f4f4ef; --texto:#2b2b2b; --muted:#6b6b63;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Sora',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--cinza);color:var(--texto);min-height:100vh;padding-bottom:100px;}
  header{background:var(--verde);color:var(--branco);padding:18px 16px 14px;}
  header .logo{display:flex;align-items:center;gap:10px;}
  header .logo .bola{width:34px;height:34px;border-radius:50%;background:var(--lima);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--verde);font-size:16px;}
  header h1{font-size:19px;font-weight:700;letter-spacing:.2px;}
  header p{font-size:12px;color:var(--lima);margin-top:2px;font-weight:600;}
  main{padding:16px;}
  .card{background:var(--branco);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .card h2{font-size:15px;font-weight:700;color:var(--verde);margin-bottom:12px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;}
  input,select{width:100%;padding:12px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;background:#fafafa;}
  input:focus,select:focus{outline:none;border-color:var(--lima);background:#fff;}
  .row{display:flex;gap:10px;}
  .row>div{flex:1;}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;}
  .btn-primary{background:var(--laranja);color:#fff;}
  .btn-lima{background:var(--lima);color:var(--verde);}
  .btn-outline{background:transparent;border:2px solid var(--verde);color:var(--verde);}
  .btn:active{opacity:.85;}
  .btn[disabled]{opacity:.5;pointer-events:none;}
  .gps-line{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--verde);font-weight:600;}
  .gps-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;}
  .gps-dot.ok{background:var(--lima);}
  nav{position:fixed;bottom:0;left:0;right:0;background:var(--branco);display:flex;border-top:1px solid #e5e5df;z-index:10;}
  nav button{flex:1;padding:12px 4px;background:none;border:none;font-family:inherit;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav button .ico{font-size:20px;}
  nav button.on{color:var(--verde);}
  nav button.on .ico{color:var(--laranja);}
  .lista-item{background:var(--branco);border-radius:12px;padding:13px;margin-bottom:10px;border-left:4px solid var(--lima);}
  .lista-item .t{font-weight:700;font-size:14px;color:var(--verde);}
  .lista-item .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .lista-item .tag{display:inline-block;background:var(--amarelo);color:var(--verde);font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:6px;}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px;}
  .empty .ico{font-size:42px;display:block;margin-bottom:8px;}
  .hidden{display:none !important;}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--verde);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;z-index:20;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;}
  .toast.show{opacity:1;}
  .stat{display:flex;gap:10px;margin-bottom:14px;}
  .stat .box{flex:1;background:var(--verde);border-radius:12px;padding:14px;color:#fff;text-align:center;}
  .stat .box .n{font-size:24px;font-weight:700;color:var(--amarelo);}
  .stat .box .l{font-size:10px;font-weight:600;color:var(--lima);margin-top:2px;}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="bola">O</div>
    <div><h1>Oiru Bio</h1><p>Rastreabilidade de copaíba</p></div>
  </div>
</header>

<main>
  <!-- VISÃO: LISTA -->
  <section id="view-lista">
    <div class="stat">
      <div class="box"><div class="n" id="n-arvores">0</div><div class="l">ÁRVORES</div></div>
      <div class="box"><div class="n" id="n-ext">0</div><div class="l">EXTRAÇÕES</div></div>
    </div>
    <div class="card">
      <h2>Copaibeiras cadastradas</h2>
      <div id="lista"></div>
    </div>
  </section>

  <!-- VISÃO: NOVA ÁRVORE -->
  <section id="view-nova" class="hidden">
    <div class="card">
      <h2>🌳 Cadastrar copaibeira</h2>
      <label>Nome popular *</label>
      <input id="f-nome" placeholder="Ex: Copaíba">
      <label>Nome científico (opcional)</label>
      <input id="f-cientifico" placeholder="Ex: Copaifera langsdorffii">
      <label>CPF do produtor *</label>
      <input id="f-cpf" inputmode="numeric" placeholder="000.000.000-00">
      <label>CNPJ (cooperativa/empresa)</label>
      <input id="f-cnpj" inputmode="numeric" placeholder="00.000.000/0001-00">
      <div class="row">
        <div><label>Latitude</label><input id="f-lat" inputmode="decimal" placeholder="-11.0000"></div>
        <div><label>Longitude</label><input id="f-lon" inputmode="decimal" placeholder="-62.0000"></div>
      </div>
      <button class="btn btn-lima" id="btn-gps" style="margin-top:14px;">📍 Usar minha localização (GPS)</button>
      <div class="gps-line" id="gps-status"><span class="gps-dot" id="gps-dot"></span><span id="gps-txt">GPS ainda não usado</span></div>
      <button class="btn btn-primary" id="btn-salvar" style="margin-top:14px;">Salvar árvore</button>
    </div>
  </section>

  <!-- VISÃO: EXTRAÇÃO -->
  <section id="view-ext" class="hidden">
    <div class="card">
      <h2>🛢️ Registrar extração</h2>
      <label>Árvore *</label>
      <select id="ext-arvore"></select>
      <label>Data *</label>
      <input id="ext-data" type="date">
      <label>Volume (litros)</label>
      <input id="ext-volume" inputmode="decimal" placeholder="Ex: 2,5">
      <label>Lote *</label>
      <input id="ext-lote" placeholder="Nº do lote">
      <label>Observação</label>
      <input id="ext-obs" placeholder="Lote, condição da árvore...">
      <button class="btn btn-primary" id="btn-salvar-ext" style="margin-top:14px;">Registrar extração</button>
    </div>
  </section>

  <!-- VISÃO: EXPORTAR -->
  <section id="view-export" class="hidden">
    <div class="card">
      <h2>📤 Exportar dados</h2>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px;">Seus dados ficam salvos neste aparelho (funciona sem internet). Exporte quando quiser enviar para o banco central.</p>
      <button class="btn btn-lima" id="btn-csv" style="margin-bottom:10px;">Baixar CSV (árvores)</button>
      <button class="btn btn-outline" id="btn-json">Baixar JSON (tudo)</button>
    </div>
  </section>
</main>

<nav>
  <button data-v="lista" class="on"><span class="ico">🌳</span>Árvores</button>
  <button data-v="nova"><span class="ico">➕</span>Nova</button>
  <button data-v="ext"><span class="ico">🛢️</span>Extração</button>
  <button data-v="export"><span class="ico">📤</span>Exportar</button>
</nav>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
